stages:
  - lint_test
  - dvc_check
  - api_tests

lint_test:
  stage: lint_test
  image: python:3.12-slim
  script:
    - pip install flake8
    - flake8 .
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"

dvc_check:
  stage: dvc_check
  image: python:3.12-slim
  script:
    - pip install "dvc[s3]"
    - dvc pull
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
      when: on_success

api_tests:
  stage: api_tests
  image: python:3.12
  script:
    - pip install -r requirements.txt
    - pytest ./tests/test-api
  needs:
    - lint_test
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
